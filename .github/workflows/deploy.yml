name: Publish ErgoLabs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - name: Find highest-numbered ErgoLabs folder
        id: site
        run: |
          latest=$(find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' |
            grep -E '^ErgoLabs [0-9]+$' | sort -V | tail -n 1)
          if [ -z "$latest" ] || [ ! -f "$latest/index.html" ]; then
            echo "No numbered ErgoLabs folder with index.html found"
            exit 1
          fi
          echo "path=$latest" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ${{ steps.site.outputs.path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
