name: Publish ErgoLabs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/configure-pages@v5

      - name: Find highest-numbered ErgoLabs folder
        id: site
        run: |
          latest=$(find . -mindepth 1 -maxdepth 1 -type d -printf '%f\n' |
            grep -E '^ErgoLabs [0-9]+$' | sort -V | tail -n 1)
          if [ -z "$latest" ] || [ ! -f "$latest/index.html" ]; then
            echo "No numbered ErgoLabs folder with an index.html was found"
            exit 1
          fi
          echo "path=$latest" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.path }}

      - id: deployment
        uses: actions/deploy-pages@v4
